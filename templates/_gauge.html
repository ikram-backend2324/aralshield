{% load aral %}<div class="gauge">
  <svg viewBox="0 0 220 120"><path d="M20 110 A90 90 0 0 1 200 110" fill="none" stroke="#1f3d55" stroke-width="18" stroke-linecap="round"/>
  <path d="M20 110 A90 90 0 0 1 200 110" fill="none" stroke="{{ color }}" stroke-width="18" stroke-linecap="round" stroke-dasharray="{% widthratio value 100 283 %} 400"/></svg>
  <div class="val" style="color:{{ color }}">{{ value }}</div>
</div>
