databases:
  - name: aralshield-db
    region: oregon
    plan: free
    databaseName: aralshield
    user: aralshield

services:
  - type: web
    name: aralshield-app
    runtime: python
    plan: free
    region: oregon
    buildCommand: "./build.sh"
    startCommand: "./start.sh"
    healthCheckPath: /api/health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DEBUG
        value: "0"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: aralshield-db
          property: connectionString
      - key: OPENROUTER_MODEL
        value: google/gemini-2.5-flash
      - key: OPENROUTER_API_KEY
        sync: false
